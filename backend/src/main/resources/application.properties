spring.application.name=seat-hold-lab
server.port=8081

# PostgreSQL chạy trong Docker, được truy cập từ Windows
spring.datasource.url=jdbc:postgresql://localhost:5433/seat_hold_lab
spring.datasource.username=lab_user
spring.datasource.password=lab_password

# Flyway quản lý cấu trúc database
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate kiểm tra cấu trúc, không tự tạo hoặc sửa bảng
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Thống nhất múi giờ khi Hibernate làm việc với database
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================================================
# Cấu hình Task 3: Tự động xử lý hết hạn giữ chỗ và Scheduling
# ==============================================================
# Thời gian giữ chỗ mặc định (giây) trước khi hết hạn
app.seat-hold.timeout-seconds=30

# Chu kỳ quét các lượt giữ hết hạn (mili-giây)
app.seat-hold.scan-interval-ms=5000

# Thời gian chờ trước lần quét đầu tiên khi khởi động ứng dụng (mili-giây)
app.seat-hold.initial-delay-ms=5000

# Bật/tắt tác vụ Scheduling (mặc định bật)
app.seat-hold.scheduling.enabled=true

# Cờ mô phỏng lỗi kiểm chứng rollback (mặc định tắt)
app.seat-hold.simulate-error=false