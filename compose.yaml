name: seat-hold-lab

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: seat_hold_lab
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d seat_hold_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: